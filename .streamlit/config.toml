# Algohns V12 — Streamlit theme: black terminal, red/green accents.
[theme]
base = "dark"
primaryColor = "#16C784"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0E0F10"
textColor = "#F5F7F8"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
