name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lean requirements
        # Deliberately the lean set, which is what Streamlit Community Cloud
        # installs: if the suite needs an optional extra, the hosted app is
        # already broken and CI should say so here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: pytest tests -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check _worker.js

  world-data-is-current:
    # The globe inlines its world payload, so changing the dataset without
    # re-running the build ships a stale globe that silently disagrees with
    # the Python engine. This catches exactly that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rebuild and diff
        run: |
          python scripts/build_world.py
          if ! git diff --quiet -- public/world; then
            echo "::error::public/world è disallineato dal dataset."
            echo "Esegui: python scripts/build_world.py"
            git diff --stat -- public/world
            exit 1
          fi
          echo "public/world allineato."
